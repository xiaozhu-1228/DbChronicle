name: dbchronicle

on:
  push:
    paths:
      - 'Src/**'
      - 'Test/**'
      - '.github/workflows/dbchronicle.yml'
  pull_request:
    paths:
      - 'Src/**'
      - 'Test/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Src/DbChronicle.sln -c Release -p:NoNetFx=true

      - name: Test
        run: dotnet test Src/DbChronicle.sln -c Release --no-build -p:NoNetFx=true

      - name: Compile all dialects
        run: dotnet run --project Src/DbChronicle.Cli -f net8.0 -c Release --no-build -- compile --config Test/samples/DbchronicleConfig.xml --all-dialects

      - name: Check migrations (strict warnings)
        run: dotnet run --project Src/DbChronicle.Cli -f net8.0 -c Release --no-build -- check --config Test/samples/DbchronicleConfig.xml --strict-warnings

      - name: Verify applied checksums (local state)
        run: dotnet run --project Src/DbChronicle.Cli -f net8.0 -c Release --no-build -- verify-checksum --config Test/samples/DbchronicleConfig.xml

      - name: License scan (reject GPL / AGPL / unknown)
        run: |
          dotnet tool install --global dotnet-project-licenses
          dotnet-project-licenses -i Src/DbChronicle.sln \
            -t "MIT;Apache-2.0;PostgreSQL;BSD-2-Clause;BSD-3-Clause;MS-PL;CC0-1.0;ISC" \
            --print-licenses
