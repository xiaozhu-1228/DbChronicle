component:
  name: DbChronicle
  version: 1.0.0
database:
  dialect: sqlite
  version: 3.35
environment: demo
paths:
  migrations: ../LogicModels/sqlite
  versionLog: ./version_log/${environment}
  output: ./output
baseline:
  file: ../LogicModels/sqlite/00000000_000000_baseline.xml
  frozen: false
  frozenAt: 
options:
  quoteIdentifiers: true
  includeComments: true
  includeRollback: false
  statementDelimiter: ;
  allowDestructive: false
  lockTimeoutSeconds: 5
  incrementalModify: true
